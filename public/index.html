		<style>
			body,
			html,
			#app {
				font-family:
					"Inter",
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				width: 100vw;
				height: 100vh;
				margin: 0;
				padding: 0;
				background-color: #050505;
				overflow: hidden;
			}

			@keyframes fade {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			/* Custom smooth keyframes & micro-animations */
			@keyframes veilPulseGlow {
				0%, 100% {
					box-shadow: 0 0 25px rgba(99, 102, 241, 0.4), 0 0 55px rgba(168, 85, 247, 0.25);
					transform: scale(1);
				}
				50% {
					box-shadow: 0 0 45px rgba(129, 140, 248, 0.75), 0 0 90px rgba(192, 132, 252, 0.5);
					transform: scale(1.03);
				}
			}

			@keyframes veilFloat {
				0%, 100% {
					transform: translateY(0px) rotate(0deg);
				}
				50% {
					transform: translateY(-8px) rotate(1deg);
				}
			}

			@keyframes veilShimmer {
				0% {
					background-position: -200% 0;
				}
				100% {
					background-position: 200% 0;
				}
			}

			@keyframes veilOrbFloat1 {
				0%, 100% {
					transform: translate(0, 0) scale(1);
				}
				33% {
					transform: translate(70px, -50px) scale(1.15);
				}
				66% {
					transform: translate(-50px, 40px) scale(0.9);
				}
			}

			@keyframes veilOrbFloat2 {
				0%, 100% {
					transform: translate(0, 0) scale(1);
				}
				33% {
					transform: translate(-60px, 60px) scale(0.85);
				}
				66% {
					transform: translate(50px, -40px) scale(1.2);
				}
			}

			@keyframes windowPopIn {
				0% {
					opacity: 0;
					transform: scale(0.92) translateY(12px);
					filter: blur(8px);
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
					filter: blur(0);
				}
			}

			@keyframes startMenuSlideUp {
				0% {
					opacity: 0;
					transform: translateY(20px) scale(0.96);
					filter: blur(6px);
				}
				100% {
					opacity: 1;
					transform: translateY(0) scale(1);
					filter: blur(0);
				}
			}

			@keyframes cardEntrance {
				0% {
					opacity: 0;
					transform: translateY(25px) scale(0.94);
					filter: blur(6px);
				}
				100% {
					opacity: 1;
					transform: translateY(0) scale(1);
					filter: blur(0);
				}
			}

			@keyframes lockScreenUnlock {
				0% {
					opacity: 1;
					transform: scale(1);
					filter: blur(0px);
				}
				100% {
					opacity: 0;
					transform: scale(1.08);
					filter: blur(16px);
				}
			}

			@keyframes windowCloseOut {
				0% {
					opacity: 1;
					transform: scale(1) translateY(0);
					filter: blur(0);
				}
				100% {
					opacity: 0;
					transform: scale(0.92) translateY(14px);
					filter: blur(8px);
				}
			}

			@keyframes startMenuSlideDown {
				0% {
					opacity: 1;
					transform: translateY(0) scale(1);
					filter: blur(0);
				}
				100% {
					opacity: 0;
					transform: translateY(18px) scale(0.95);
					filter: blur(6px);
				}
			}

			@keyframes modalFadeOut {
				0% {
					opacity: 1;
					transform: scale(1);
				}
				100% {
					opacity: 0;
					transform: scale(0.94);
				}
			}

			.animate-veil-glow {
				animation: veilPulseGlow 3.5s ease-in-out infinite;
			}

			.animate-veil-float {
				animation: veilFloat 5.5s ease-in-out infinite;
			}

			.animate-orb-1 {
				animation: veilOrbFloat1 18s ease-in-out infinite;
			}

			.animate-orb-2 {
				animation: veilOrbFloat2 22s ease-in-out infinite;
			}

			.animate-window-pop {
				animation: windowPopIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.animate-window-close {
				animation: windowCloseOut 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
			}

			.animate-start-menu {
				animation: startMenuSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.animate-start-menu-close {
				animation: startMenuSlideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
			}

			.animate-lock-unlock {
				animation: lockScreenUnlock 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
				pointer-events: none !important;
			}

			.animate-fade-out {
				animation: modalFadeOut 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
			}

			.animate-card-entrance {
				animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.shimmer-btn {
				background-size: 200% 100%;
				background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
				animation: veilShimmer 3s infinite linear;
			}

			.dock-icon-anim {
				transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.2s ease;
			}

			.dock-icon-anim:hover {
				transform: translateY(-6px) scale(1.18);
				box-shadow: 0 10px 25px -5px rgba(129, 140, 248, 0.5);
			}

			.dock-icon-anim:active {
				transform: translateY(-2px) scale(0.95);
			}

			.app-card-anim {
				transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
			}

			.app-card-anim:hover {
				transform: translateY(-4px) scale(1.02);
				box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 15px rgba(255,255,255,0.1);
			}

			.app-card-anim:active {
				transform: translateY(0) scale(0.98);
			}

			/* Custom sleek dark scrollbar */
			.custom-scrollbar::-webkit-scrollbar {
				width: 5px;
				height: 5px;
			}
			.custom-scrollbar::-webkit-scrollbar-track {
				background: transparent;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb {
				background: rgba(255, 255, 255, 0.15);
				border-radius: 9999px;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb:hover {
				background: rgba(255, 255, 255, 0.3);
			}

			/* Selected item highlight with prominent white outline */
			.selected-item {
				outline: 2px solid #ffffff !important;
				outline-offset: 1px !important;
				border: 1px solid #ffffff !important;
				box-shadow: 0 0 12px rgba(255, 255, 255, 0.25) !important;
			}

			/* Spotlight & Overlay Keyframes */
			@keyframes spotlightIn {
				0% {
					opacity: 0;
					transform: scale(0.96) translateY(-8px);
					filter: blur(8px);
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
					filter: blur(0);
				}
			}

			@keyframes toastSlideIn {
				0% {
					opacity: 0;
					transform: translateX(45px) scale(0.92);
				}
				100% {
					opacity: 1;
					transform: translateX(0) scale(1);
				}
			}

			@keyframes contextPopIn {
				0% {
					opacity: 0;
					transform: scale(0.92) translateY(-4px);
					filter: blur(4px);
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
					filter: blur(0);
				}
			}

			.animate-spotlight {
				animation: spotlightIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.animate-toast {
				animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.animate-context-menu {
				animation: contextPopIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			.resize-grip {
				position: absolute;
				bottom: 0;
				right: 0;
				width: 16px;
				height: 16px;
				cursor: se-resize;
				z-index: 50;
			}
			.resize-grip::after {
				content: '';
				position: absolute;
				right: 3px;
				bottom: 3px;
				width: 8px;
				height: 8px;
				border-right: 2px solid rgba(255, 255, 255, 0.35);
				border-bottom: 2px solid rgba(255, 255, 255, 0.35);
				transition: border-color 0.2s;
			}
			.resize-grip:hover::after {
				border-color: rgba(255, 255, 255, 0.85);
			}
		</style>
